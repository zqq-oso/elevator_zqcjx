<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elevator UI</title>
  <style>
    body { font-family: Arial; display: flex; margin: 0; padding: 20px; }
    #visual { flex: 1; margin-right: 20px; }
    #status { flex: 1; }
    .elevator-shaft { display: inline-block; width: 60px; height: 400px; border: 1px solid #000; position: relative; margin-right: 10px; }
    .elevator { width: 100%; height: 30px; position: absolute; transition: top 0.2s; text-align: center; line-height: 30px; font-size: 12px; }
    .up { background-color: lightgreen; }
    .down { background-color: lightcoral; }
    .idle { background-color: lightgray; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  </style>
</head>
<body>

  <div id="visual">
    <h3>Elevator Visual</h3>
    <div id="shafts"></div>
  </div>

  <div id="status">
    <h3>Elevator Status</h3>
    <table>
      <thead>
        <tr><th>ID</th><th>Floor</th><th>Target</th><th>Direction</th><th>Passengers</th></tr>
      </thead>
      <tbody id="statusBody"></tbody>
    </table>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000/api/state";
    const floors = 6; // 可根据实际动态获取
    const shafts = 2; // 电梯数量

    function initVisual() {
      const container = document.getElementById("shafts");
      for (let i = 0; i < shafts; i++) {
        const shaft = document.createElement("div");
        shaft.className = "elevator-shaft";
        shaft.id = "shaft" + i;
        const elevator = document.createElement("div");
        elevator.className = "elevator idle";
        elevator.id = "elevator" + i;
        elevator.style.bottom = "0px";
        elevator.innerText = "E" + i;
        shaft.appendChild(elevator);
        container.appendChild(shaft);
      }
    }

    function updateUI(state) {
      const elevators = state.elevators;
      const tbody = document.getElementById("statusBody");
      tbody.innerHTML = "";
      elevators.forEach(e => {
        const row = document.createElement("tr");
        row.innerHTML = `
        <td>${e.id}</td>
        <td>${e.position.current_floor}</td>
        <td>${e.position.target_floor}</td>
        <td>${e.last_tick_direction}</td>
        <td>${e.passengers.length}</td>
        `;
        tbody.appendChild(row);

        const visual = document.getElementById("elevator" + e.id);
        visual.style.bottom = (e.current_floor * 30) + "px";
        const direction = (e.target_floor_direction || "idle").toLowerCase();
        visual.className = "elevator " + direction;
      });
    }

    async function fetchState() {
      try {
        const res = await fetch("http://127.0.0.1:8000/api/state");
        const data = await res.json();
        updateUI(data);
      } catch (err) {
        console.error("Failed to fetch state:", err);
      }
    }

    initVisual();
    setInterval(fetchState, 300); // 每300ms刷新一次
  </script>

</body>
</html>
